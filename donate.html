<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate Blood</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80')
                  center center/cover no-repeat;
    }

    /* Form hidden */
    .form-container {
      display: Flex/* 馃憟 Makes the form invisible */
      min-width: 340px;
      width: 340px;
      margin: 40px auto;
      background: linear-gradient(135deg, #35d8c0bb 40%, #47a3f3cc 100%);
      padding: 32px 28px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 32px #0002;
      position: relative;
      top: 50px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
      letter-spacing: 1.5px;
      color: #002b36;
    }

    label {
      margin-top: 10px;
      font-size: 15px;
      color: #1a242f;
      font-weight: 600;
    }

    input, select {
      margin-top: 4px;
      padding: 8px 10px;
      border: none;
      outline: none;
      border-radius: 4px;
      background: #f2ffffbb;
      font-size: 15px;
      margin-bottom: 4px;
    }

    input[type="date"] {
      color: #262626;
    }

    button {
      background: #82f7b0;
      color: #19531c;
      padding: 9px 0;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      margin-top: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background: #2ccec6;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="form-container" id="formContainer">
    <form id="donateForm">
      <h2>DONATE BLOOD</h2>

      <label>Name:</label>
      <input type="text" name="name" placeholder="Enter your name" required />

      <label>Blood Group:</label>
      <select name="blood_group" required>
        <option value="" disabled selected>Select blood group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>

      <label>Address:</label>
      <input type="text" name="address" placeholder="Enter your address" required />

      <label>Contact No:</label>
      <input type="tel" name="contact" placeholder="Enter 10-digit number" required pattern="[6-9]{1}[0-9]{9}" title="Phone number must be 10 digits and start with 6, 7, 8, or 9" />

      <label>Hospital:</label>
      <input type="text" name="hospital" placeholder="Enter hospital name" required />

      <label>Diseases:</label>
      <input type="text" name="diseases" placeholder="If any" />

      <label>Date of Birth:</label>
      <input type="date" name="dob" required />

      <button type="submit">Submit</button>
    </form>
  </div>

  <!-- 鉁� Firebase Realtime Database Integration -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // 馃敟 Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
      authDomain: "blood-donation-website-c7a25.firebaseapp.com",
      databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
      projectId: "blood-donation-website-c7a25",
      storageBucket: "blood-donation-website-c7a25.appspot.com",
      messagingSenderId: "380005737107",
      appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Calculate age
    function calculateAge(dob) {
      const birthDate = new Date(dob);
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      const monthDiff = today.getMonth() - birthDate.getMonth();
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age;
    }

    // Form submission
    document.getElementById("donateForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = e.target;

      const contact = form.contact.value.trim();
      if (!/^[6-9]\d{9}$/.test(contact)) {
        alert("鈿狅笍 Please enter a valid 10-digit phone number starting with 6, 7, 8, or 9.");
        return;
      }

      const age = calculateAge(form.dob.value);
      if (age < 18) {
        alert("鈿狅笍 Age must be 18 or older to donate blood.");
        return;
      }

      const donor = {
        name: form.name.value,
        blood_group: form.blood_group.value,
        address: form.address.value,
        contact: contact,
        hospital: form.hospital.value,
        diseases: form.diseases.value || "None",
        dob: form.dob.value,
        status: "Pending"
      };

      db.ref("donors").push(donor)
        .then(() => {
          alert("鉁� Successfully Registered!");
          form.reset();
          form.blood_group.selectedIndex = 0;
        })
        .catch((error) => {
          console.error("Error adding donor:", error);
          alert("鈿狅笍 Failed to register donor. Please try again.");
        });
    });

    // 馃攧 Optional: To show the form later
    // document.getElementById("formContainer").style.display = "block";
  </script>
</body>
</html>
