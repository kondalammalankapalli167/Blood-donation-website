<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Donate Blood</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .background {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: -2;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80')
                  center center/cover no-repeat;
    }

    .form-container {
      min-width: 340px;
      width: 340px;
      margin: 40px auto;
      background: linear-gradient(135deg, #35d8c0bb 40%, #47a3f3cc 100%);
      padding: 32px 28px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 32px #0002;
      position: relative;
      top: 50px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
      font-family: Arial, sans-serif;
      letter-spacing: 1.5px;
    }

    label {
      margin-top: 10px;
      font-size: 15px;
      color: #1a242f;
      font-weight: 600;
    }

    input, select {
      margin-top: 4px;
      padding: 8px 10px;
      border: none;
      outline: none;
      border-radius: 4px;
      background: #f2ffffbb;
      font-size: 15px;
      margin-bottom: 4px;
    }

    input[type="date"] {
      color: #262626;
    }

    button {
      background: #82f7b0;
      color: #19531c;
      padding: 9px 0;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      margin-top: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2ccec6;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="form-container">
    <form id="donateForm">
      <h2>DONATE BLOOD</h2>
      <label>Name:</label>
      <input type="text" name="name" placeholder="Name" required />

      <label>Blood Group:</label>
      <select name="blood_group" required>
        <option value="" disabled selected>Select blood</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>

      <label>Address:</label>
      <input type="text" name="address" placeholder="Enter your address" required />

      <label>Contact No:</label>
      <input type="tel" name="contact" placeholder="Enter your number" required />

      <label>Hospital:</label>
      <input type="text" name="hospital" placeholder="Enter hospital name" required />

      <label>Diseases:</label>
      <input type="text" name="diseases" placeholder="If Any" />

      <label>Date Of Birth:</label>
      <input type="date" name="dob" required />

      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    document.getElementById("donateForm").addEventListener("submit", function(e) {
      e.preventDefault();

      // Collect donor details
      const donor = {
        name: this.name.value,
        blood_group: this.blood_group.value,
        address: this.address.value,
        contact: this.contact.value,
        hospital: this.hospital.value,
        diseases: this.diseases.value,
        dob: this.dob.value
      };

      // Save donor in localStorage
      let donors = JSON.parse(localStorage.getItem("donors")) || [];
      donors.push(donor);
      localStorage.setItem("donors", JSON.stringify(donors));

      // Increment blood group count
      let bloodData = JSON.parse(localStorage.getItem("bloodData")) || {};
      bloodData[donor.blood_group] = (bloodData[donor.blood_group] || 0) + 1;
      localStorage.setItem("bloodData", JSON.stringify(bloodData));

      // Increment total donors
      let totalDonors = parseInt(localStorage.getItem("totalDonors")) || 0;
      totalDonors++;
      localStorage.setItem("totalDonors", totalDonors);

      alert("Thank you, " + donor.name + "! You are registered as a donor (" + donor.blood_group + ").");

      // Reset form (clear inputs & dropdowns back to default)
      this.reset();
      this.querySelector("select[name='blood_group']").selectedIndex = 0;
    });
  </script>
</body>
</html>
