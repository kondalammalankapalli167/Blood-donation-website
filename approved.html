<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Approved Donors</title>
<!-- Boxicons CDN -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, sans-serif;
  background: #f8f9fa;
  display: flex;
}
.sidebar {
  width: 60px;
  height: 100vh;
  background-color: #33bfa7;
  color: #fff;
  padding: 20px 0;
  overflow: hidden;
  border-radius: 5px 0 0 5px;
  transition: width 0.4s ease;
  position: fixed;
  top: 0;
  left: 0;
}
.sidebar:hover {
  width: 200px;
}
.sidebar h2 {
  text-align: center;
  font-weight: 700;
  margin-bottom: 30px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
}
.sidebar:hover h2 {
  opacity: 1;
}
.sidebar ul {
  list-style-type: none;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-left: 0;
}
.sidebar ul li {
  padding: 10px 15px;
  cursor: pointer;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  transition: background-color 0.3s;
}
.sidebar ul li:hover {
  background-color: #33bfa7;
}
.sidebar ul li a {
  color: inherit;
  text-decoration: none;
  display: flex;
  align-items: center;
  width: 100%;
}
.sidebar ul li a i {
  font-size: 22px;
  min-width: 30px;
}
.sidebar ul li a span {
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  padding-left: 8px;
}
.sidebar:hover ul li a span {
  opacity: 1;
}

.main {
  margin-left: 60px;
  padding: 20px;
  width: 100%;
  transition: margin-left 0.4s ease;
}
.sidebar:hover ~ .main {
  margin-left: 200px;
}

h2 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  box-shadow: 0px 2px 6px #ccc;
}
th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}
th {
  background: #33bfa7;
}
</style>
</head>
<body>
<div class="sidebar">
  <h2>Admin</h2>
  <ul>
    <li><a href="admin.html"><i class='bx bxs-home'></i><span>Home</span></a></li>
    <li><a href="donar.html"><i class='bx bx-user'></i><span>Donor</span></a></li>
    <li><a href="approved.html"><i class='bx bx-check-circle'></i><span>Approved Donors</span></a></li>
    <li><a href="#" id="logoutApproved"><i class='bx bx-log-out'></i><span>Logout</span></a></li>
  </ul>
</div>

<div class="main">
  <h2>APPROVED DONORS:</h2>
  <table id="approvedTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Blood Group</th>
        <th>Address</th>
        <th>Contact</th>
        <th>Hospital</th>
        <th>Diseases</th>
        <th>DOB</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
    authDomain: "blood-donation-website-c7a25.firebaseapp.com",
    databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
    projectId: "blood-donation-website-c7a25",
    storageBucket: "blood-donation-website-c7a25.appspot.com",
    messagingSenderId: "380005737107",
    appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tableBody = document.querySelector("#approvedTable tbody");

  function loadApprovedDonors() {
    tableBody.innerHTML = "";
    db.ref("approvedDonors").on("value", (snapshot) => {
      const donors = snapshot.val();
      if (!donors) {
        tableBody.innerHTML = `<tr><td colspan="7">No approved donors found</td></tr>`;
        return;
      }
      tableBody.innerHTML = "";
      Object.values(donors).forEach(donor => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${donor.name || ''}</td>
          <td>${donor.blood_group || ''}</td>
          <td>${donor.address || ''}</td>
          <td>${donor.contact || ''}</td>
          <td>${donor.hospital || ''}</td>
          <td>${donor.diseases || ''}</td>
          <td>${donor.dob || ''}</td>
        `;
        tableBody.appendChild(row);
      });
    });
  }

  document.getElementById("logoutApproved").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.clear();
    window.location.href = "alert.html";
  });

  loadApprovedDonors();
</script>
</body>
</html>
