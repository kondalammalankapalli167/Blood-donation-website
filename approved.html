<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Approved Donors</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f9fa;
  }
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 200px;
    height: 100%;
    background: #2ab7a9;
    color: white;
    padding-top: 20px;
  }
  .sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
  }
  .sidebar ul {
    list-style: none;
    padding-left: 0;
  }
  .sidebar ul li {
    padding: 12px 20px;
    cursor: pointer;
  }
  .sidebar ul li:hover {
    background: #219085;
  }
  .sidebar ul li a {
    color: white;
    text-decoration: none;
    display: block;
  }
  .main {
    margin-left: 200px;
    padding: 20px;
  }
  h2 {
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0px 2px 6px #ccc;
  }
  th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
  }
  th {
    background: #efefef;
  }
</style>
</head>
<body>
<div class="sidebar">
  <h2>Admin</h2>
  <ul>
    <li><a href="admin.html">Home</a></li>
    <li><a href="donar.html">Donor</a></li>
    <li><a href="approved.html">Approved Donors</a></li>
    <li><a href="#" id="logoutApproved">Logout</a></li>
  </ul>
</div>

<div class="main">
  <h2>APPROVED DONORS:</h2>
  <table id="approvedTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Blood Group</th>
        <th>Address</th>
        <th>Contact</th>
        <th>Hospital</th>
        <th>Diseases</th>
        <th>DOB</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
  // 🔥 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
    authDomain: "blood-donation-website-c7a25.firebaseapp.com",
    databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
    projectId: "blood-donation-website-c7a25",
    storageBucket: "blood-donation-website-c7a25.appspot.com",
    messagingSenderId: "380005737107",
    appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tableBody = document.querySelector("#approvedTable tbody");

  // 🔹 Load only approved donors
  function loadApprovedDonors() {
    tableBody.innerHTML = "";
    db.ref("approvedDonors").on("value", (snapshot) => {
      const donors = snapshot.val();
      if (!donors) {
        tableBody.innerHTML = `<tr><td colspan="7">No approved donors found</td></tr>`;
        return;
      }
      tableBody.innerHTML = "";
      Object.values(donors).forEach(donor => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${donor.name || ''}</td>
          <td>${donor.blood_group || ''}</td>
          <td>${donor.address || ''}</td>
          <td>${donor.contact || ''}</td>
          <td>${donor.hospital || ''}</td>
          <td>${donor.diseases || ''}</td>
          <td>${donor.dob || ''}</td>
        `;
        tableBody.appendChild(row);
      });
    });
  }

  // 🚪 Logout
  document.getElementById("logoutApproved").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.clear();
    window.location.href = "alert.html";
  });

  loadApprovedDonors();
</script>
</body>
</html>
