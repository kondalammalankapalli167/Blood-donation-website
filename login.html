<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login Page</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('Screenshot_2025_0910_201855.jpg') no-repeat center center/cover;
            z-index: -1;
            filter: brightness(0.7);
        }
        .login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(41, 41, 60, 0.3);
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.21);
            text-align: center;
            min-width: 320px;
        }
        h2 {
            color: #fff;
            margin-bottom: 22px;
            font-weight: 400;
        }
        input[type="email"], input[type="password"] {
            width: 90%;
            padding: 10px 14px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background-color: rgba(255,255,255,0.9);
            outline: none;
        }
        button[type="submit"] {
            width: 94%;
            padding: 12px 0;
            margin-top: 14px;
            background: #ffaa98;
            color: #333;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: #ff8c7a;
        }
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            color: #fff;
            font-size: 0.97rem;
        }
        .options a {
            color: #ffbfae;
            text-decoration: none;
            cursor: pointer;
        }
        .options a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="login-container">
        <form id="loginForm">
            <h2>Have an account?</h2>
            <input type="email" placeholder="Enter Email" id="email" required />
            <input type="password" placeholder="Password" id="password" required />
            <button type="submit">SIGN IN</button>
            <div class="options">
                <label>
                    <input type="checkbox" id="rememberMe" />
                    Remember Me
                </label>
                <a id="forgotPassword">Forgot Password?</a>
            </div>
        </form>
    </div>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
            authDomain: "blood-donation-website-c7a25.firebaseapp.com",
            databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
            projectId: "blood-donation-website-c7a25",
            storageBucket: "blood-donation-website-c7a25.appspot.com",
            messagingSenderId: "380005737107",
            appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Auto-fill remembered values
        window.onload = function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            const rememberedPassword = localStorage.getItem('rememberedPassword');
            const rememberChecked = localStorage.getItem('rememberMeChecked');

            if (rememberedEmail && rememberedPassword && rememberChecked === "true") {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('password').value = rememberedPassword;
                document.getElementById('rememberMe').checked = true;
            }
        };

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;

            // Remember me feature
            if (rememberMe) {
                localStorage.setItem('rememberedEmail', emailInput);
                localStorage.setItem('rememberedPassword', passwordInput);
                localStorage.setItem('rememberMeChecked', "true");
            } else {
                localStorage.removeItem('rememberedEmail');
                localStorage.removeItem('rememberedPassword');
                localStorage.setItem('rememberMeChecked', "false");
            }

            // Check Admin login
            if (emailInput === "admin@gmail.com" && passwordInput === "admin123") {
                alert("✅ Login successful as Admin.");
                window.location.href = "adminlogin.html";
                return;
            }

            // Check donors in pendingDonors and approvedDonors
            const donorNodes = ["pendingDonors", "approvedDonors"];
            let found = false;

            Promise.all(donorNodes.map(node => db.ref(node).once("value")))
                .then(snapshots => {
                    snapshots.forEach(snapshot => {
                        snapshot.forEach(childSnapshot => {
                            const donor = childSnapshot.val();
                            if (donor.email === emailInput && donor.password === passwordInput) {
                                found = true;
                            }
                        });
                    });

                    if (found) {
                        alert("✅ Login successful as Donor.");
                        window.location.href = "b.html";
                    } else {
                        alert("⚠️ Invalid email or password. Please try again.");
                    }
                })
                .catch(error => {
                    console.error("Error reading data:", error);
                    alert("⚠️ Unable to connect to the database.");
                });
        });

        // Forgot Password
        document.getElementById('forgotPassword').addEventListener('click', function(e) {
            e.preventDefault();
            const emailPrompt = prompt("Enter your registered email to reset password:");
            if (emailPrompt) {
                db.ref("donors").once("value")
                    .then(snapshot => {
                        let exists = false;
                        snapshot.forEach(childSnapshot => {
                            if (childSnapshot.val().email === emailPrompt) {
                                exists = true;
                            }
                        });

                        if (exists || emailPrompt === "admin@gmail.com") {
                            alert("🔗 Password reset link sent to " + emailPrompt);
                            window.location.href = "reset.html";
                        } else {
                            alert("⚠️ This email is not registered with us.");
                        }
                    });
            }
        });
    </script>
</body>
</html>
