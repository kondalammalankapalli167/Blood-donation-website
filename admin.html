<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blood Bank Admin Dashboard</title>
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f1f1f1;color:#333;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background-color:#33bfa7;color:#fff;padding-top:20px;}
.sidebar h2{text-align:center;margin-bottom:30px;font-weight:700;}
.sidebar ul{list-style:none;padding-left:20px;}
.sidebar ul li{margin-bottom:18px;font-size:17px;}
.sidebar ul li a{color:white;text-decoration:none;display:block;}
.sidebar ul li a:hover{text-decoration:underline;}
.main{margin-left:220px;padding:20px 30px;}
.header{font-weight:700;font-size:20px;display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.cards-container{display:flex;flex-direction:column;gap:20px;}
.cards-row{display:flex;gap:16px;}
.card{background:#ebebeb;border-radius:15px;width:120px;height:65px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:1px 1px 6px #bbb;font-weight:700;}
.card .blood-group{color:purple;font-size:18px;}
.card .blood-icon{color:#d30000;}
.card .count{font-size:16px;font-weight:normal;}
.info-row{margin-top:20px;display:flex;gap:14px;}
.info-card{min-width:160px;height:65px;background:#ebebeb;border-radius:15px;font-weight:600;font-size:15px;display:flex;justify-content:center;align-items:center;box-shadow:1px 1px 6px #bbb;color:#222;cursor:pointer;}
.info-card:hover{background:#d1e5e0;}
</style>
</head>
<body>

<nav class="sidebar">
  <h2>ADMIN</h2>
  <ul>
    <li><a href="b.html">Home</a></li>
    <li><a href="donar.html">Donor</a></li>
        <li><a href="approved.html">Approve Donor</a></li>
    
    <li><a href="bloodrequests.html">Blood Request</a></li>
    <li><a href="approvedetails.html">Approve Request</a></li>
    <li><a href="#" id="logoutAdmin">Logout</a></li>
  </ul>
</nav>

<div class="main">
  <header class="header">
    <span>BLOOD DASHBOARD</span>
  </header>

  <div class="cards-container">
    <div class="cards-row" id="upperRow"></div>
    <div class="cards-row" id="lowerRow"></div>
  </div>

  <div class="info-row">
    <div class="info-card">
      Total Donors : <strong id="donorCount">0</strong>
    </div>
    <div class="info-card">
      Total Requests : <strong id="requestCount">0</strong>
    </div>
    <div class="info-card" id="approvedCountCard" title="Click to view approved donors">
      Approved Requests: <strong id="approvedCount">0</strong>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // ✅ Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
    authDomain: "blood-donation-website-c7a25.firebaseapp.com",
    databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
    projectId: "blood-donation-website-c7a25",
    storageBucket: "blood-donation-website-c7a25.appspot.com",
    messagingSenderId: "380005737107",
    appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const bloodGroups = ["A+","B+","O-","O+","AB+","AB-","A-","B-"];

  function createCard(type, count){
    const card = document.createElement("div");
    card.className = "card";
    const groupSpan = document.createElement("span");
    groupSpan.className = "blood-group";
    groupSpan.textContent = type;
    const dropSpan = document.createElement("span");
    dropSpan.className = "blood-icon";
    dropSpan.textContent = "🩸";
    const groupWrapper = document.createElement("div");
    groupWrapper.style.display = "flex";
    groupWrapper.style.alignItems = "center";
    groupWrapper.style.justifyContent = "center";
    groupWrapper.style.gap = "5px";
    groupWrapper.appendChild(groupSpan);
    groupWrapper.appendChild(dropSpan);
    const countSpan = document.createElement("span");
    countSpan.className = "count";
    countSpan.textContent = count;
    card.appendChild(groupWrapper);
    card.appendChild(countSpan);
    return card;
  }

  function renderDashboard(bloodData, donorCount){
    document.getElementById("donorCount").textContent = donorCount;
    const upperRow = document.getElementById("upperRow");
    const lowerRow = document.getElementById("lowerRow");
    upperRow.innerHTML = "";
    lowerRow.innerHTML = "";
    bloodGroups.forEach((type, index) => {
      const count = bloodData[type] || 0;
      const card = createCard(type, count);
      if(index < 4){ upperRow.appendChild(card); }
      else { lowerRow.appendChild(card); }
    });
  }

  // 🔹 Count donors and show blood group distribution
  db.ref("donors").on("value", snapshot => {
    const donors = snapshot.val() || {};
    const donorCount = Object.keys(donors).length;
    let bloodData = {};
    Object.values(donors).forEach(donor => {
      const bg = donor.blood_group || donor.bloodGroup;
      if(bg) bloodData[bg] = (bloodData[bg] || 0) + 1;
    });
    renderDashboard(bloodData, donorCount);
  });

  // 🔹 Count total blood requests
  db.ref("bloodRequests").on("value", snapshot => {
    const requests = snapshot.val() || {};
    const totalRequests = Object.keys(requests).length;
    document.getElementById("requestCount").textContent = totalRequests;
  });

  // 🔹 Count approved requests
  db.ref("approvedRequests").on("value", snapshot => {
    const approved = snapshot.val() || {};
    const approvedCount = Object.keys(approved).length;
    document.getElementById("approvedCount").textContent = approvedCount;
  });

  // 🔹 Logout
  document.getElementById("logoutAdmin").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.clear();
    window.location.href = "alert.html";
  });
</script>
</body>
</html>
