<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Logged Out</title>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .message-box {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    .message-box h2 { color: #d80000; }
    .btn {
      display: inline-block;
      background: #d80000;
      padding: 10px 20px;
      color: #fff;
      border-radius: 5px;
      margin-top: 15px;
      text-decoration: none;
      font-weight: bold;
    }
    .btn:hover { background: #a00000; }
  </style>
</head>
<body>
  <div class="message-box">
    <h2>You have been logged out successfully.</h2>
    <a href="login.html" class="btn">Go to Login</a>
  </div>
</body>
</html>
