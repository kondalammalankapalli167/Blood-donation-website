<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blood Bank</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      background: url('blood.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    .navbar {
      background: rgba(41,41,60,0.3);
      box-shadow: 0 2px 5px #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 30px;
      backdrop-filter: blur(4px);
    }
    .logo {
      font-weight: bold;
      color: #d80000;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      gap: 20px;
      padding: 0;
      margin: 0;
    }
    .navbar ul li {
      display: inline;
    }
    .navbar ul a {
      text-decoration: none;
      color: #222;
      padding: 6px 10px;
      border-radius: 3px;
      transition: background 0.2s;
    }
    .navbar ul a:hover,
    .navbar ul .active {
      background: #d80000;
      color: #fff;
    }
    .logout-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 6px 18px;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .logout-btn:hover {
      background: #d80000;
    }
    .center-banner {
      text-align: center;
      margin-top: 30px;
    }
    .center-banner img {
      width: 100%;
      max-width: 700px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <span class="logo">🩸 BLOOD BANK</span>
    <ul>
      <li><a href="a.html" class="active">Home</a></li>
      <li><a href="donate.html">Donate</a></li>
      <li><a href="request.html">Request</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <div class="center-banner">
    <!-- Add a relevant image or content here if needed -->
    <!-- Example: <img src="your-banner.jpg" alt="Blood Donation Banner"> -->
  </div>

  <script>
    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('registeredEmail');
      localStorage.removeItem('registeredPassword');
      window.location.href = "alert.html";
    });
  </script>
</body>
</html>
