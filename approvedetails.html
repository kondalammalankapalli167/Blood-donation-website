<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Approved Blood Requests</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f8f9fa; }
    .sidebar { position:fixed; top:0; left:0; width:200px; height:100%; background:#2ab7a9; color:white; padding-top:20px; }
    .sidebar h2 { text-align:center; margin-bottom:30px; }
    .sidebar ul { list-style:none; padding-left:0; }
    .sidebar ul li { padding:12px 20px; cursor:pointer; }
    .sidebar ul li:hover { background:#219085; }
    .sidebar ul li a { color:white; text-decoration:none; display:block; }
    .main { margin-left:200px; padding:20px; }
    table { width:100%; border-collapse:collapse; background:white; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    th, td { padding:10px; border:1px solid #ddd; text-align:center; }
    th { background:#efefef; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Admin</h2>
    <ul>
      <li><a href="admin.html">Home</a></li>
      <li><a href="bloodrequests.html">Blood Requests</a></li>
      <li><a href="#" id="logoutApproved">Logout</a></li>
    </ul>
  </div>

  <div class="main">
    <h2>Approved Blood Requests</h2>
    <table>
      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Hospital</th>
          <th>Blood Type</th>
          <th>Blood Unit</th>
        </tr>
      </thead>
      <tbody id="approvedTableBody"></tbody>
    </table>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
      authDomain: "blood-donation-website-c7a25.firebaseapp.com",
      databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
      projectId: "blood-donation-website-c7a25",
      storageBucket: "blood-donation-website-c7a25.appspot.com",
      messagingSenderId: "380005737107",
      appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loadApprovedRequests() {
      const tbody = document.getElementById("approvedTableBody");
      db.ref("approvedRequests").on("value", snapshot => {
        const approved = snapshot.val();
        tbody.innerHTML = "";
        if (!approved) {
          tbody.innerHTML = "<tr><td colspan='4'>No approved requests found.</td></tr>";
          return;
        }
        Object.values(approved).forEach(req => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${req.patient || ''}</td>
            <td>${req.hospital || ''}</td>
            <td>${req.blood || ''}</td>
            <td>${req.unit || ''}</td>
          `;
          tbody.appendChild(row);
        });
      });
    }

    document.getElementById("logoutApproved").addEventListener("click", e => {
      e.preventDefault();
      window.location.href = "alert.html";
    });

    loadApprovedRequests();
  </script>
</body>
</html>
