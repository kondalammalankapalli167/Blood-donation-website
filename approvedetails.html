<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Approved Blood Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; display: flex; }
    .sidebar { width: 220px; background: #2db39c; color: #fff; height: 100vh; padding: 20px 0; position: fixed; }
    .sidebar h2 { text-align: center; margin-bottom: 30px; }
    .sidebar ul { list-style: none; padding: 0; }
    .sidebar ul li { padding: 12px 20px; cursor: pointer; }
    .sidebar ul li a { color:white; text-decoration:none; display:block; }
    .sidebar ul li:hover { background:#24907e; }
    .main-content { margin-left: 220px; padding: 20px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background:white; box-shadow:0px 2px 6px rgba(0,0,0,0.2); }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Admin</h2>
    <ul>
      <li><a href="admin.html">Home</a></li>
      <li><a href="bloodrequests.html">Blood Request</a></li>
      <li><a href="approvedetails.html">Approve Details</a></li>
      <li><a href="#" id="logoutApprovedReq">Logout</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <h2>Blood Request</h2>
    <h3>APPROVED DETAILS:</h3>

    <table>
      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Hospital Name</th>
          <th>Blood Type</th>
          <th>Blood Unit</th>
        </tr>
      </thead>
      <tbody id="approvedTableBody">
        <!-- Dynamic approved requests will load here -->
      </tbody>
    </table>
  </div>

  <script>
    function loadApproved() {
      let approved = JSON.parse(localStorage.getItem("approvedRequests")) || [];
      let tbody = document.getElementById("approvedTableBody");
      tbody.innerHTML = "";

      if (approved.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4">No approved requests found</td></tr>`;
        return;
      }

      approved.forEach(req => {
        let row = `
          <tr>
            <td>${req.patient}</td>
            <td>${req.hospital}</td>
            <td>${req.blood}</td>
            <td>${req.unit}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    loadApproved();

    // Logout functionality
    document.getElementById("logoutApprovedReq").addEventListener("click", function(e) {
      e.preventDefault();
      // Clear login and requests data
      localStorage.removeItem("registeredEmail");
      localStorage.removeItem("registeredPassword");
      localStorage.removeItem("approvedRequests");
      localStorage.removeItem("donors");
      localStorage.removeItem("approvedDonors");
      localStorage.removeItem("bloodData");
      localStorage.removeItem("totalDonors");
      localStorage.removeItem("totalRequests");
      localStorage.removeItem("approvedCount");

      // Redirect to alert.html
      window.location.href = "alert.html";
    });
  </script>

</body>
</html>
