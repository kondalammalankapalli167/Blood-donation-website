<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Donor Details</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f9fa;
  }
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    width: 200px;
    height: 100%;
    background: #2ab7a9;
    color: white;
    padding-top: 20px;
  }
  .sidebar h2 {
    text-align: center;
    margin-bottom: 30px;
  }
  .sidebar ul {
    list-style: none;
    padding-left: 0;
  }
  .sidebar ul li {
    padding: 12px 20px;
    cursor: pointer;
  }
  .sidebar ul li a {
    color: white;
    text-decoration: none;
    display: block;
  }
  .sidebar ul li:hover {
    background: #219085;
  }
  .main {
    margin-left: 200px;
    padding: 20px;
  }
  h2 {
    margin-bottom: 20px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0px 2px 6px #ccc;
  }
  th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
  }
  th {
    background: #efefef;
  }
  .btn {
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
  }
  .btn-edit { background: orange; }
  .btn-delete { background: red; }
  .btn-approve { background: green; }
</style>
</head>
<body>
  <div class="sidebar">
    <h2>Donor</h2>
    <ul>
      <li><a href="admin.html">Home</a></li>
      <li><a href="#">Donor</a></li>
      <li><a href="#" id="logoutDonarPage">Logout</a></li>
    </ul>
  </div>

  <div class="main">
    <h2>DONOR DETAILS:</h2>
    <table id="donorTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Blood Group</th>
          <th>Address</th>
          <th>Contact</th>
          <th>Hospital</th>
          <th>Diseases</th>
          <th>DOB</th>
          <th>Approve</th>
          <th>Reject</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  let donors = JSON.parse(localStorage.getItem("donors")) || [];
  const tableBody = document.querySelector("#donorTable tbody");

  function renderTable() {
    tableBody.innerHTML = "";
    donors.forEach((donor, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${donor.name}</td>
        <td>${donor.blood_group}</td>
        <td>${donor.address}</td>
        <td>${donor.contact}</td>
        <td>${donor.hospital}</td>
        <td>${donor.diseases}</td>
        <td>${donor.dob}</td>
        <td><button class="btn btn-approve" onclick="approveDonor(${index})">Approve</button></td>
        <td><button class="btn btn-edit" onclick="rejectDonor(${index})">Reject</button></td>
        <td><button class="btn btn-delete" onclick="deleteDonor(${index})">Delete</button></td>
      `;
      tableBody.appendChild(row);
    });
  }

  function deleteDonor(index) {
    if (confirm("Are you sure you want to delete this donor?")) {
      donors.splice(index, 1);
      localStorage.setItem("donors", JSON.stringify(donors));
      renderTable();
    }
  }

  function approveDonor(index) {
    let approvedDonors = JSON.parse(localStorage.getItem("approvedDonors")) || [];
    approvedDonors.push(donors[index]);
    localStorage.setItem("approvedDonors", JSON.stringify(approvedDonors));

    let approvedCount = parseInt(localStorage.getItem("approvedCount")) || 0;
    approvedCount++;
    localStorage.setItem("approvedCount", approvedCount);

    alert(`Donor ${donors[index].name} approved!`);
  }

  function rejectDonor(index) {
    alert(`Donor ${donors[index].name} rejected.`);
  }

  renderTable();

  // Logout functionality
  document.getElementById("logoutDonarPage").addEventListener("click", function(e) {
    e.preventDefault();
    // Clear relevant data
    localStorage.removeItem("registeredEmail");
    localStorage.removeItem("registeredPassword");
    localStorage.removeItem("donors");
    localStorage.removeItem("approvedDonors");
    localStorage.removeItem("approvedCount");
    localStorage.removeItem("bloodData");
    localStorage.removeItem("totalDonors");
    localStorage.removeItem("totalRequests");

    // Redirect to alert page
    window.location.href = "alert.html";
  });
</script>
</body>
</html>
