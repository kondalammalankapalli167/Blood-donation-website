
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glowing Animated Login Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }
    body, html {
      height: 100%;
      width: 100vw;
      background: #252432;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('Screenshot_2025_0910_201855.jpg') no-repeat center center/cover;
      z-index: 0;
      filter: brightness(0.7);
    }
    @property --a {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    .box {
      position: relative;
      width: 400px;
      height: 182px;
      background: repeating-conic-gradient(
        from var(--a),
        #ff2770 0%,
        #ff2770 5%,
        transparent 5%,
        transparent 40%,
        #ff2770 50%
      );
      filter: drop-shadow(0 15px 50px #000);
      animation: rotating 4s linear infinite;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.5s;
      z-index: 1;
    }
    .box:hover {
      width: 450px;
      height: 500px;
    }
    @keyframes rotating {
      0% {
        --a: 0deg;
      }
      100% {
        --a: 360deg;
      }
    }
    .box::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: repeating-conic-gradient(
        from var(--a),
        #45f3ff 0%,
        #45f3ff 5%,
        transparent 5%,
        transparent 40%,
        #45f3ff 50%
      );
      filter: drop-shadow(0 15px 50px #000);
      border-radius: 20px;
      animation: rotating 4s linear infinite;
      animation-delay: -1s;
      z-index: 0;
    }
    .box::after {
      content: "";
      position: absolute;
      inset: 4px;
      background: #2d2d39;
      border-radius: 15px;
      border: 8px solid #25252b;
      z-index: 1;
    }
    .login {
      position: absolute;
      inset: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      background: rgba(0,0,0,0.2);
      z-index: 10;
      flex-direction: column;
      box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
      border-bottom: 2px solid rgba(255,255,255,0.5);
      transition: 0.5s;
      color: #fff;
      overflow: hidden;
    }
    .box:hover .login {
      inset: 40px;
    }
    .loginBx {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transform: translateY(126px);
      gap: 20px;
      width: 70%;
      transition: 0.5s;
    }
    .box:hover .loginBx {
      transform: translateY(0px);
    }
    .loginBx h2 {
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .loginBx h2 i {
      color: #ff2770;
      text-shadow: 0 0 5px #ff2770, 0 0 30px #ff2770;
    }
    .loginBx input[type="email"],
    .loginBx input[type="password"] {
      width: 100%;
      padding: 10px 20px;
      outline: none;
      font-size: 1em;
      color: #fff;
      background: rgba(0,0,0,0.1);
      border: 2px solid #fff;
      border-radius: 30px;
    }
    .loginBx input::placeholder {
      color: #999;
    }
    .loginBx input[type="submit"],
    .loginBx button[type="submit"] {
      width: 100%;
      background: #45f3ff;
      border: none;
      font-weight: 500;
      color: #111;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 1em;
      cursor: pointer;
      margin-top: 0;
      box-shadow: none;
      transition: box-shadow .5s, background .3s;
    }
    .loginBx input[type="submit"]:hover,
    .loginBx button[type="submit"]:hover {
      box-shadow: 0 0 10px #45f3ff, 0 0 60px #45f3ff;
    }
    .group {
      display: flex;
      width: 100%;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 1em;
    }
    .group label,
    .group a {
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      font-weight: 400;
      flex: 1;
      user-select: none;
    }
    .group a:nth-child(2) {
      color: #ff2770;
      font-weight: 600;
      text-align: right;
    }
    .group label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    @media (max-width: 520px) {
      .box {
        width: 92vw;
        min-width: 0;
        height: 98vw;
        min-height: 340px;
      }
      .background {
        background-size: cover;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="box">
    <div class="login">
      <form class="loginBx" id="loginForm" autocomplete="off">
        <h2>
          <i class="fa-solid fa-right-to-bracket"></i>
          Login
          <i class="fa-solid fa-heart"></i>
        </h2>
        <input type="email" id="email" placeholder="Enter Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign in</button>
        <div class="group">
          <label><input type="checkbox" id="rememberMe" /> Remember Me</label>
          <a id="forgotPassword">Forgot Password?</a>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Firebase Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
      authDomain: "blood-donation-website-c7a25.firebaseapp.com",
      databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
      projectId: "blood-donation-website-c7a25",
      storageBucket: "blood-donation-website-c7a25.appspot.com",
      messagingSenderId: "380005737107",
      appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Auto-fill remembered values
    window.onload = function() {
      const rememberedEmail = localStorage.getItem('rememberedEmail');
      const rememberedPassword = localStorage.getItem('rememberedPassword');
      const rememberChecked = localStorage.getItem('rememberMeChecked');
      if (rememberedEmail && rememberedPassword && rememberChecked === "true") {
        email.value = rememberedEmail;
        password.value = rememberedPassword;
        rememberMe.checked = true;
      }
    };

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const emailInput = email.value.trim();
      const passwordInput = password.value.trim();
      const remember = rememberMe.checked;

      if (remember) {
        localStorage.setItem('rememberedEmail', emailInput);
        localStorage.setItem('rememberedPassword', passwordInput);
        localStorage.setItem('rememberMeChecked', "true");
      } else {
        localStorage.removeItem('rememberedEmail');
        localStorage.removeItem('rememberedPassword');
        localStorage.setItem('rememberMeChecked', "false");
      }

      if (emailInput === "admin@gmail.com" && passwordInput === "admin123") {
        alert("✅ Login successful as Admin.");
        window.location.href = "adminlogin.html";
        return;
      }

      const donorNodes = ["pendingDonors", "approvedDonors"];
      let found = false;
      Promise.all(donorNodes.map(node => db.ref(node).once("value")))
        .then(snapshots => {
          snapshots.forEach(snapshot => {
            snapshot.forEach(childSnapshot => {
              const donor = childSnapshot.val();
              if (donor.email === emailInput && donor.password === passwordInput) {
                found = true;
              }
            });
          });
          if (found) {
            alert("✅ Login successful as Donor.");
            window.location.href = "b.html";
          } else {
            alert("⚠️ Invalid email or password. Please try again.");
          }
        })
        .catch(error => {
          console.error("Error reading data:", error);
          alert("⚠️ Unable to connect to the database.");
        });
    });

    // Forgot Password
    forgotPassword.addEventListener('click', function(e) {
      e.preventDefault();
      const emailPrompt = prompt("Enter your registered email to reset password:");
      if (emailPrompt) {
        db.ref("donors").once("value")
          .then(snapshot => {
            let exists = false;
            snapshot.forEach(childSnapshot => {
              if (childSnapshot.val().email === emailPrompt) {
                exists = true;
              }
            });
            if (exists || emailPrompt === "admin@gmail.com") {
              alert("🔗 Password reset link sent to " + emailPrompt);
              window.location.href = "reset.html";
            } else {
              alert("⚠️ This email is not registered with us.");
            }
          });
      }
    });
  </script>
</body>
</html>
