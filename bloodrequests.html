<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Blood Requests</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background:  #f5f5f5; }
    .sidebar { width: 220px; background: #2bbbad; height: 100vh; position: fixed; top:0; left:0; padding-top: 20px; color: white; }
    .sidebar h2 { text-align: center; margin-bottom: 20px; }
    .sidebar a { display: block; padding: 12px 20px; text-decoration: none; color: white; }
    .sidebar a:hover { background: #26a69a; }
    .main-content { margin-left: 220px; padding: 20px; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
    th { background: #2bbbad; color: white; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-approve { background: green; }
    .btn-reject { background: orange; }
    .btn-delete { background: red; }
    .action-buttons { display: flex; justify-content: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Admin</h2>
    <a href="admin.html">Home</a>
    <a href="bloodrequests.html">Blood Requests</a>
    <a href="approvedetails.html">Approved Details</a>
    <a href="#" id="logoutBloodReq">Logout</a>
  </div>

  <div class="main-content">
    <h2>REQUEST DETAILS:</h2>
    <table>
      <thead>
        <tr>
          <th>Patient Name</th>
          <th>Hospital</th>
          <th>Blood Type</th>
          <th>Blood Unit</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="requestTableBody"></tbody>
    </table>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
      authDomain: "blood-donation-website-c7a25.firebaseapp.com",
      databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
      projectId: "blood-donation-website-c7a25",
      storageBucket: "blood-donation-website-c7a25.appspot.com",
      messagingSenderId: "380005737107",
      appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Load all blood requests
    function loadRequests() {
      const tbody = document.getElementById("requestTableBody");
      db.ref('bloodRequests').on('value', snapshot => {
        const requests = snapshot.val();
        tbody.innerHTML = "";

        if (!requests) {
          tbody.innerHTML = `<tr><td colspan="5">No blood requests found</td></tr>`;
          return;
        }

        Object.keys(requests).forEach(key => {
          const req = requests[key];
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${req.patient}</td>
            <td>${req.hospital}</td>
            <td>${req.blood}</td>
            <td>${req.unit}</td>
            <td class="action-buttons">
              <button class="btn btn-approve">Approve</button>
              <button class="btn btn-reject">Reject</button>
              <button class="btn btn-delete">Delete</button>
            </td>
          `;

          // Approve button
          row.querySelector(".btn-approve").addEventListener("click", () => {
            db.ref('approvedRequests/' + key).set(req)
              .then(() => alert(`${req.patient}'s request approved!`))
              .catch(err => alert(err.message));
          });

          // Reject button
          row.querySelector(".btn-reject").addEventListener("click", () => {
            db.ref('rejectedRequests/' + key).set(req)
              .then(() => alert(`${req.patient}'s request rejected!`))
              .catch(err => alert(err.message));
          });

          // Delete button (removes from bloodRequests AND approvedRequests)
          row.querySelector(".btn-delete").addEventListener("click", () => {
            if (confirm("Are you sure you want to delete this request?")) {
              db.ref('bloodRequests/' + key).remove()
                .then(() => db.ref('approvedRequests/' + key).remove())
                .then(() => alert('Request deleted successfully from all records.'))
                .catch(err => alert(err.message));
            }
          });

          tbody.appendChild(row);
        });
      });
    }

    loadRequests();

    // Logout
    document.getElementById("logoutBloodReq").addEventListener("click", e => {
      e.preventDefault();
      window.location.href = "alert.html";
    });
  </script>
</body>
</html>
