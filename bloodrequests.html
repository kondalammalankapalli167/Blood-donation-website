<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Blood Requests</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Boxicons CDN -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 60px;
  height: 100vh;
  background-color:#33bfa7;
  color: #fff;
  padding: 20px 0;
  overflow: hidden;
  border-radius: 5px 0 0 5px;
  transition: width 0.4s ease;
  position: fixed;
  left: 0;
  top: 0;
}
.sidebar:hover {
  width: 200px;
}
.sidebar h2 {
  text-align: center;
  font-weight: 700;
  margin-bottom: 30px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
}
.sidebar:hover h2 {
  opacity: 1;
}
.sidebar ul {
  list-style-type: none;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-left: 0;
}
.sidebar ul li {
  padding: 10px 15px;
  cursor: pointer;
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  transition: background-color 0.3s;
}
.sidebar ul li:hover {
  background-color:#33bfa7;
}
.sidebar ul li a {
  color: inherit;
  text-decoration: none;
  display: flex;
  align-items: center;
  width: 100%;
}
.sidebar ul li a i {
  font-size: 22px;
  min-width: 30px;
}
.sidebar ul li a span {
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  padding-left: 8px;
}
.sidebar:hover ul li a span {
  opacity: 1;
}

/* Main content */
.main-content {
  margin-left: 60px;
  padding: 20px;
  width: 100%;
  transition: margin-left 0.4s ease;
}
.sidebar:hover ~ .main-content {
  margin-left: 200px;
}
h2 {
  margin-bottom: 20px;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  box-shadow: 0 2px 6px #ccc;
}
th, td {
  padding: 12px;
  border: 1px solid #ddd;
  text-align: center;
}
th {
  background: #33bfa7;
  color: white;
}
.btn {
  padding: 6px 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  color: white;
}
.btn-approve {
  background: green;
}
.btn-reject {
  background: orange;
}
.btn-delete {
  background: red;
}
.action-buttons {
  display: flex;
  justify-content: center;
  gap: 6px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>Admin</h2>
  <ul>
    <li><a href="admin.html"><i class='bx bxs-home'></i><span>Home</span></a></li>
    <li><a href="bloodrequests.html"><i class='bx bx-droplet'></i><span>Blood Requests</span></a></li>
    <li><a href="approvedetails.html"><i class='bx bx-check-circle'></i><span>Approved Details</span></a></li>
    <li><a href="#" id="logoutBloodReq"><i class='bx bx-log-out'></i><span>Logout</span></a></li>
  </ul>
</div>

<div class="main-content">
  <h2>REQUEST DETAILS:</h2>
  <table>
    <thead>
      <tr>
        <th>Patient Name</th>
        <th>Hospital</th>
        <th>Blood Type</th>
        <th>Blood Unit</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="requestTableBody"></tbody>
  </table>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDYH9xybMpLnYvNQiNt-SBc9Kk-0pYTm7w",
  authDomain: "blood-donation-website-c7a25.firebaseapp.com",
  databaseURL: "https://blood-donation-website-c7a25-default-rtdb.firebaseio.com",
  projectId: "blood-donation-website-c7a25",
  storageBucket: "blood-donation-website-c7a25.appspot.com",
  messagingSenderId: "380005737107",
  appId: "1:380005737107:web:89a7bbe5f5a16ac7a8a366"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loadRequests() {
  const tbody = document.getElementById("requestTableBody");
  db.ref('bloodRequests').on('value', snapshot => {
    const requests = snapshot.val();
    tbody.innerHTML = "";

    if (!requests) {
      tbody.innerHTML = `<tr><td colspan="5">No blood requests found</td></tr>`;
      return;
    }

    Object.keys(requests).forEach(key => {
      const req = requests[key];
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${req.patient}</td>
        <td>${req.hospital}</td>
        <td>${req.blood}</td>
        <td>${req.unit}</td>
        <td class="action-buttons">
          <button class="btn btn-approve">Approve</button>
          <button class="btn btn-reject">Reject</button>
          <button class="btn btn-delete">Delete</button>
        </td>
      `;

      row.querySelector(".btn-approve").addEventListener("click", () => {
        db.ref('approvedRequests/' + key).set(req)
          .then(() => alert(`${req.patient}'s request approved!`))
          .catch(err => alert(err.message));
      });

      row.querySelector(".btn-reject").addEventListener("click", () => {
        db.ref('rejectedRequests/' + key).set(req)
          .then(() => alert(`${req.patient}'s request rejected!`))
          .catch(err => alert(err.message));
      });

      row.querySelector(".btn-delete").addEventListener("click", () => {
        if (confirm("Are you sure you want to delete this request?")) {
          db.ref('bloodRequests/' + key).remove()
            .then(() => db.ref('approvedRequests/' + key).remove())
            .then(() => alert('Request deleted successfully.'))
            .catch(err => alert(err.message));
        }
      });

      tbody.appendChild(row);
    });
  });
}

loadRequests();

document.getElementById("logoutBloodReq").addEventListener("click", e => {
  e.preventDefault();
  window.location.href = "alert.html";
});
</script>

</body>
</html>
